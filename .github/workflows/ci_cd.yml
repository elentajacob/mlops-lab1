name: ML CI/CD - Train, Test, Containerize

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: us-east4
  REPOSITORY_NAME: my-repo

jobs:
  train-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest test/ -v

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Train and save model
        shell: bash
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          VERSION_FILE_NAME: ${{ secrets.VERSION_FILE_NAME }}
        run: |
          python src/train_and_save_model.py | tee train_output.txt
          MODEL_VERSION=$(grep "MODEL_VERSION_OUTPUT:" train_output.txt | awk '{print $2}')
          if [ -z "$MODEL_VERSION" ]; then echo "Model version not found"; exit 1; fi
          echo "MODEL_VERSION=$MODEL_VERSION" >> $GITHUB_ENV

      - name: Build and Push Docker image
        env:
          IMAGE_NAME: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/model-image
        run: |
          docker build -t ${IMAGE_NAME}:${{ env.MODEL_VERSION }} .
          docker push ${IMAGE_NAME}:${{ env.MODEL_VERSION }}
          docker tag ${IMAGE_NAME}:${{ env.MODEL_VERSION }} ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:latest
